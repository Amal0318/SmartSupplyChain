version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: production_ai_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: production_ai_agent
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: production_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=production_ai_agent
      - LLM_PROVIDER=mock
      - APP_ENV=development
      - DEBUG=true
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mongodb_data:
